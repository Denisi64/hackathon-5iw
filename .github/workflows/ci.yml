name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test report
        run: pnpm test:report

      - name: Coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Summary
        if: always()
        run: |
          {
            echo "## Checks"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Install | done |"
            echo "| Lint | done |"
            echo "| Tests | reports in artifacts |"
            echo "| Coverage | HTML reports in artifacts |"
            echo "| Build | done |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-coverage-reports
          path: |
            apps/backend/reports
            apps/frontend/reports
            apps/backend/coverage
            apps/frontend/coverage
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compose config
        run: docker compose config

      - name: Start
        run: make start

      - name: Backend
        run: curl -fsS http://localhost:3000/api/health

      - name: Frontend
        run: curl -fsSI http://localhost:5173

      - name: Pgweb
        run: curl -fsS http://localhost:8081 >/dev/null

      - name: Docker summary
        if: always()
        run: |
          {
            echo "## Docker"
            echo ""
            echo '```text'
            docker compose ps
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save logs
        if: always()
        run: |
          mkdir -p reports/docker
          docker compose logs --no-color > reports/docker/compose.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs
          path: reports/docker
          if-no-files-found: warn
          retention-days: 7

      - name: Stop
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Image names
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          branch="${GITHUB_REF_NAME//\//-}"
          echo "BACKEND_IMAGE=ghcr.io/${repo}/backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${repo}/frontend" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${branch}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          target: production
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}

      - name: Publish summary
        run: |
          {
            echo "## Images"
            echo ""
            echo "- Backend: \`${BACKEND_IMAGE}:${IMAGE_TAG}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

services:
  frontend:
    build:
      context: ./apps/frontend
      target: development
      network: host
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    command: pnpm dev
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - comutitres

  backend:
    build:
      context: ./apps/backend
      target: development
      network: host
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    command: pnpm dev
    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - comutitres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comutitres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comutitres_dev}
      POSTGRES_DB: ${POSTGRES_DB:-comutitres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comutitres} -d ${POSTGRES_DB:-comutitres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comutitres

  pgweb:
    image: sosedoff/pgweb:0.16.2
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://comutitres:comutitres_dev@postgres:5432/comutitres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comutitres

  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    environment:
      SECRET: "comutitres-directus-secret"
      ADMIN_EMAIL: "admin@comutitres.fr"
      ADMIN_PASSWORD: "admin123"
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: comutitres
      DB_USER: comutitres
      DB_PASSWORD: comutitres_dev
      WEBSOCKETS_ENABLED: "false"
      PUBLIC_URL: "http://localhost:8055"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:8055"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "50"
      RATE_LIMITER_DURATION: "1"
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comutitres

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - comutitres

volumes:
  pg_data:
  minio_data:
  directus_uploads:
  frontend_node_modules:
  backend_node_modules:

networks:
  comutitres:
    driver: bridge
